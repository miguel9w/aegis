name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: pixi + pytest (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.74.0
          cache: true

      - name: Resolver ambiente (pixi install)
        run: pixi install

      - name: Rodar suíte de testes
        run: pixi run test

      - name: Verificar que o grafo importa e compila
        run: pixi run python -c "
          import aegis.exportador, aegis.recuperacao, aegis.gateways.webhook;
          import aegis.ferramentas, aegis.grafo, aegis.tui;
          print('imports OK')"
