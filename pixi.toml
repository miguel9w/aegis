# =====================================================================
# Project Aegis — Agente Pessoal Autônomo
# Manifesto Pixi (prefix.dev) — ambiente 100% reproduzível
# =====================================================================
[workspace]
name = "aegis"
version = "0.11.0"
description = "Project Aegis — Agente Pessoal Autônomo (LangGraph + Pixi + Rich)"
authors = ["Miguel <miguel.bett.pandini@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

# ---------------------------------------------------------------------
# Tasks de execução (ex.: `pixi run start`, `pixi run dev`)
# ---------------------------------------------------------------------
[tasks]
start = "python main.py"                     # TUI interativa (streaming de eventos)
dev   = "python main.py --dev"               # modo verboso (mostra todos os eventos)
test  = "pytest -q"                          # suíte de testes
help  = "python main.py --help"              # ajuda da CLI
skills = "python main.py --listar-skills"    # lista habilidades (extensions/skills)
ferramentas = "python main.py --listar-ferramentas"  # lista ferramentas registradas
export-sharegpt = "python main.py --exportar-sharegpt"  # config/dados/trajetorias → ShareGPT
export-openai = "python main.py --exportar-openai"      # config/dados/trajetorias → OpenAI/RL
gateway = "python main.py --gateway"         # serve o grafo via Webhook HTTP
agendador = "python main.py --agendador"     # loop do cron interno (executa vencidos)
agendador_uma_vez = "python main.py --agendador-uma-vez"  # roda vencidos uma vez e sai
papeis = "python main.py --papeis"           # lista papéis / --papeis NOME define o ativo
memoria = "python main.py --memoria"         # memória pontuada (--memoria consulta)
plano = "python main.py --plano"             # plano de tarefas corrente
notas = "python main.py --notas"             # notas recentes
papers = "python main.py --papers"           # busca no arXiv (--papers consulta)
obsidian = "python main.py --obsidian"  # lista o vault de notas Obsidian
prompts = "python main.py --prompts"   # lista os prompts avançados (APF)
webui = "bun ./webui/server.ts"        # web UI técnica (Bun + ponte LangGraph)
webui-build = "bun build ./webui/src/app.ts --outdir ./webui/public/dist"  # bundle de produção
webui-test = "bun test ./webui/*.test.ts"  # testes do servidor web (bridge fake)

# ---------------------------------------------------------------------
# Dependências conda (binários nativos + runtime)
# ---------------------------------------------------------------------
[dependencies]
# Python 3.11: versão alvo exigida (>=3.11,<3.12)
python = ">=3.11,<3.12"
rich = ">=13.7.0"                 # renderização visual / TUI
python-dotenv = ">=1.0.0"         # carregamento de .env (isolamento de chaves)
bun = ">=1.3.11,<2"

# ---------------------------------------------------------------------
# Dependências pip (resolvidas pelo Pixi via PEP 723 / pypi-dependencies)
# Nota: o pacote PyPI "duckduckgo-search" foi REMOVIDO do PyPI em ago/2025.
# Seu sucessor mantido pela comunidade é **ddgs** (mesma API: `from ddgs import DDGS`).
# ---------------------------------------------------------------------
[pypi-dependencies]
langgraph = ">=0.4.0"
langgraph-checkpoint-sqlite = ">=3.0.0"  # SqliteSaver + SqliteStore (checkpoints)
aiosqlite = ">=0.20.0"                     # AsyncSqliteSaver (streaming da TUI)
langchain-core = ">=0.3.0"
langchain-openai = ">=0.2.0"               # abstração ChatOpenAI (DeepSeek/OpenRouter)
openai = ">=1.40.0"                        # exceções de rate-limit/cota
ddgs = ">=8.0.0"                           # busca web DuckDuckGo (API DDGS)
requests = ">=2.31.0"                      # fallback SearXNG para busca web
textual = ">=0.80.0"                       # TUI moderna (substitui o loop Live do Rich)
linkify-it-py = ">=2.0.0"                  # plugin linkify p/ Markdown do Textual
pytest = ">=8.0.0"                         # testes
