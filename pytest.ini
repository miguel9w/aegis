# Configuração do pytest — garante que o pacote `aegis` (raiz do projeto)
# seja importável e limita a descoberta à pasta tests/.
[pytest]
pythonpath = .
testpaths = tests
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning:langchain*
    ignore::DeprecationWarning:langgraph*
    ignore::UserWarning:pydantic*
